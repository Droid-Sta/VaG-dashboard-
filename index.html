<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>VW Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(to bottom, #203a43, #2c5364);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            color: #fff; padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px; padding: 30px; max-width: 600px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        h1 { text-align: center; margin-bottom: 10px; font-size: 1.5rem; letter-spacing: 1px; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 20px; font-size: 0.9rem; }
        .subtitle .note { color: #ffb454; font-size: 0.8rem; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1; padding: 10px; border: none; border-radius: 10px;
            background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-weight: 600;
            transition: 0.3s; font-size: 1rem;
        }
        .tab.active { background: #4a90e2; box-shadow: 0 4px 12px rgba(74,144,226,0.4); }
        .mode-block { display: none; }
        .mode-block.active { display: block; }

        label { display: block; margin-top: 15px; font-size: 0.9rem; opacity: 0.9; }

        select, input[type="text"] {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px;
            border: none; background: rgba(255,255,255,0.15); color: #fff;
            font-size: 1rem; font-family: monospace; letter-spacing: 1px;
            outline: none; transition: 0.3s;
        }
        select:focus, input[type="text"]:focus { background: rgba(255,255,255,0.25); box-shadow: 0 0 0 2px #4a90e2; }
        select {
            appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 35px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2212%22%20height%3D%2212%22%20viewBox%3D%220%200%2012%2012%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M2%204l4%204%204-4z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat; background-position: right 10px center;
        }
        select option { background: #203a43; color: #fff; }

        .counter {
            margin-top: 15px; font-size: 0.85rem; opacity: 0.85; text-align: center;
            display: none;
        }
        .counter.show { display: block; }

        .info-card { margin-top: 15px; display: none; }
        .info-card.show { display: block; }

        .record {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #4a90e2;
        }
        .record-title {
            font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px;
            color: #4a90e2; font-family: monospace;
            word-break: break-all;
        }
        .record-details {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 8px; font-size: 0.85rem;
        }
        .detail-item {
            background: rgba(255,255,255,0.1); padding: 8px 10px; border-radius: 8px;
            min-width: 0;
        }
        .detail-item.wide { grid-column: span 2; }
        .detail-label {
            font-size: 0.7rem; opacity: 0.7; margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .detail-value {
            font-weight: 600; letter-spacing: 0.5px; font-family: monospace;
            word-break: break-word;
        }
        .detail-value.locked { color: #ff6b6b; }
        .empty-message {
            text-align: center; opacity: 0.7; padding: 20px; display: none;
        }
        .info { margin-top: 20px; font-size: 0.8rem; opacity: 0.9; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 VW Dashboard</h1>
        <div class="subtitle">База щитков приборов VDO / JCI<br>
            
        </div>

        <div class="tabs">
            <button type="button" class="tab active" data-target="search-mode">Поиск</button>
            <button type="button" class="tab" data-target="filter-mode">Фильтр</button>
        </div>

        <div id="search-mode" class="mode-block active">
            <label for="searchInput">Номер, SW, HW, MCU, иммо, модель, Locked:</label>
            <input type="text" id="searchInput" placeholder="Например: 5G1920791, Golf 7, Locked" autocomplete="off">
            <div class="counter" id="searchCounter"></div>
            <div class="info-card" id="searchInfoCard"></div>
            <div class="empty-message" id="searchEmpty">Ничего не найдено</div>
        </div>

        <div id="filter-mode" class="mode-block">
            <label for="mcuSelect">Микроконтроллер (MCU):</label>
            <select id="mcuSelect"><option value="">-- Любой --</option></select>

            <label for="makerSelect">Производитель:</label>
            <select id="makerSelect"><option value="">-- Любой --</option></select>

            <label for="immoSelect">Тип иммобилайзера:</label>
            <select id="immoSelect"><option value="">-- Любой --</option></select>

            <label for="lockedSelect">Locked:</label>
            <select id="lockedSelect">
                <option value="">-- Любой --</option>
                <option value="Locked">Locked</option>
            </select>

            <div class="counter" id="filterCounter"></div>
            <div class="info-card" id="filterInfoCard"></div>
            <div class="empty-message" id="filterEmpty">Выберите параметры фильтра</div>
        </div>

        <div class="info">⚠️ Не нашли щиток или нашли ошибку? Напишите через команду <b>/feedback</b>.<br>
		     <span class="note">* данные требуют уточнения (производитель / иммо)</span>
		</div>
    </div>

        const cars = raw.trim().split('\n').map(line => {
            const parts = line.split('|').map(s => s.trim());
            return {
                part:   parts[0] || '',
                sw:     parts[1] || '',
                hw:     parts[2] || '',
                maker:  parts[3] || '',
                mcu:    parts[4] || '',
                immo:   parts[5] || '',
                model:  parts[6] || '',
                locked: parts[7] || ''
            };
        }).filter(c => c.part);

        const MAX_RENDER = 200;

        const tabs = document.querySelectorAll('.tab');
        const modeBlocks = document.querySelectorAll('.mode-block');

        const searchInput     = document.getElementById('searchInput');
        const searchInfoCard  = document.getElementById('searchInfoCard');
        const searchEmpty     = document.getElementById('searchEmpty');
        const searchCounter   = document.getElementById('searchCounter');

        const mcuSelect       = document.getElementById('mcuSelect');
        const makerSelect     = document.getElementById('makerSelect');
        const immoSelect      = document.getElementById('immoSelect');
        const lockedSelect    = document.getElementById('lockedSelect');
        const filterInfoCard  = document.getElementById('filterInfoCard');
        const filterEmpty     = document.getElementById('filterEmpty');
        const filterCounter   = document.getElementById('filterCounter');

        const uniqueMcus   = [...new Set(cars.map(c => c.mcu).filter(Boolean))].sort();
        const uniqueMakers = [...new Set(cars.map(c => c.maker).filter(Boolean))].sort();
        const uniqueImmos  = [...new Set(cars.map(c => c.immo).filter(Boolean))].sort();

        uniqueMcus.forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v;
            mcuSelect.appendChild(o);
        });
        uniqueMakers.forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v;
            makerSelect.appendChild(o);
        });
        uniqueImmos.forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v;
            immoSelect.appendChild(o);
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                modeBlocks.forEach(block => block.classList.remove('active'));
                document.getElementById(this.getAttribute('data-target')).classList.add('active');
            });
        });

        function renderRecords(records, cardId, emptyId, counterId, emptyText) {
            const card    = document.getElementById(cardId);
            const empty   = document.getElementById(emptyId);
            const counter = document.getElementById(counterId);

            card.innerHTML = '';
            card.classList.remove('show');
            empty.style.display = 'none';
            counter.classList.remove('show');

            if (emptyText) empty.textContent = emptyText;

            if (records.length === 0) {
                empty.style.display = 'block';
                return;
            }

            const toRender = records.slice(0, MAX_RENDER);

            toRender.forEach(car => {
                const recordDiv = document.createElement('div');
                recordDiv.className = 'record';

                const title = document.createElement('div');
                title.className = 'record-title';
                title.textContent = car.part;
                recordDiv.appendChild(title);

                const details = document.createElement('div');
                details.className = 'record-details';

                const fields = [
                    { label: 'Software (SW)', value: car.sw || '—' },
                    { label: 'Hardware (HW)', value: car.hw || '—' },
                    { label: 'Производитель', value: car.maker || '—' },
                    { label: 'MCU',           value: car.mcu || '—' },
                    { label: 'Иммо',          value: car.immo || '—' },
                    { label: 'Model auto',    value: car.model || '—' },
                    { label: 'Locked',        value: car.locked || '—', wide: true, cls: car.locked ? 'locked' : '' }
                ];

                fields.forEach(field => {
                    const item = document.createElement('div');
                    item.className = 'detail-item' + (field.wide ? ' wide' : '');

                    const label = document.createElement('div');
                    label.className = 'detail-label';
                    label.textContent = field.label;

                    const value = document.createElement('div');
                    value.className = 'detail-value' + (field.cls ? ' ' + field.cls : '');
                    value.textContent = field.value;

                    item.appendChild(label);
                    item.appendChild(value);
                    details.appendChild(item);
                });

                recordDiv.appendChild(details);
                card.appendChild(recordDiv);
            });

            counter.textContent = records.length > MAX_RENDER
                ? `Найдено: ${records.length}. Показаны первые ${MAX_RENDER}. Уточните запрос.`
                : `Найдено: ${records.length}`;
            counter.classList.add('show');

            card.classList.add('show');
        }

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            if (!query) {
                searchInfoCard.classList.remove('show');
                searchEmpty.style.display = 'none';
                searchCounter.classList.remove('show');
                return;
            }

            const records = cars.filter(car =>
                car.part.toLowerCase().includes(query) ||
                car.sw.toLowerCase().includes(query) ||
                car.hw.toLowerCase().includes(query) ||
                car.maker.toLowerCase().includes(query) ||
                car.mcu.toLowerCase().includes(query) ||
                car.immo.toLowerCase().includes(query) ||
                car.model.toLowerCase().includes(query) ||
                car.locked.toLowerCase().includes(query)
            );

            renderRecords(records, 'searchInfoCard', 'searchEmpty', 'searchCounter');
        });

        function applyFilter() {
            const mcu    = mcuSelect.value;
            const maker  = makerSelect.value;
            const immo   = immoSelect.value;
            const locked = lockedSelect.value;

            if (!mcu && !maker && !immo && !locked) {
                filterInfoCard.classList.remove('show');
                filterEmpty.style.display = 'none';
                filterCounter.classList.remove('show');
                return;
            }

            const records = cars.filter(car =>
                (!mcu    || car.mcu === mcu) &&
                (!maker  || car.maker === maker) &&
                (!immo   || car.immo === immo) &&
                (!locked || car.locked === locked)
            );

            renderRecords(records, 'filterInfoCard', 'filterEmpty', 'filterCounter',
                'По заданным фильтрам ничего не найдено');
        }

        mcuSelect.addEventListener('change', applyFilter);
        makerSelect.addEventListener('change', applyFilter);
        immoSelect.addEventListener('change', applyFilter);

    </script>
